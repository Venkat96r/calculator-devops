name: calculator   # fixed project name makes repeated `up -d` idempotent

services:
  app:
    image: ${DOCKERHUB_USER:-local}/calculator-api:${IMAGE_TAG:-latest}
    build: .
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xmx256m
    expose:
      - "8080"
    networks:
      - calc-net
    restart: unless-stopped
    deploy:
      replicas: 2          # two replicas behind nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"          # 8081 because Jenkins usually owns 8080
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - calc-net
    restart: unless-stopped

networks:
  calc-net:
    driver: bridge
