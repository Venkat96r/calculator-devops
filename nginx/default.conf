server {
    listen 80;

    # Docker's embedded DNS; re-resolve so redeploys do not leave stale IPs
    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream http://app:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
